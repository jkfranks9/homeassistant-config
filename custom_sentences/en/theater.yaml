#=================#
#     Theater     #
#=================#

intents:
  
  BreakTime:
    data:
      - sentences:
          - "take a break"
  
  CloseCinema:
    data:
      - sentences:
          - "close (theater | cinema)"
  
  LowerVolume:
    data:
      - sentences:
          - "(loudness down | [it's] too loud)"
  
  OpenCinema:
    data:
      - sentences:
          - "open (theater | cinema)"
  
  PlayFeature:
    data:
      - sentences:
          - "play feature [movie]"
  
  RaiseVolume:
    data:
      - sentences:
          - "(loudness up | [it's] too quiet)"
  
  RestartShieldTV:
    data:
      - sentences:
          - "restart Shield TV"
  
  ResumeCinema:
    data:
      - sentences:
          - "(continue | resume) [the] (theater | cinema | movie | show)"
  
  StartBluray:
    data:
      - sentences:
          - "start blu-ray"
  
  StartLaserdisc:
    data:
      - sentences:
          - "start laserdisc"
  
  StartStreaming:
    data:
      - sentences:
          - "start streaming"
  
  StartTurntable:
    data:
      - sentences:
          - "start turntable"
  
  WatchAmazonPrime:
    data:
      - sentences:
          - "[(watch | open | start)] Amazon [Prime]"
  
  WatchAMCPlus:
    data:
      - sentences:
          - "[(watch | open | start)] (AMC | Amy) [Plus]"
  
  WatchDisneyPlus:
    data:
      - sentences:
          - "[(watch | open | start)] Disney [Plus]"
  
  WatchHulu:
    data:
      - sentences:
          - "[(watch | open | start)] Hulu"
  
  WatchKodi:
    data:
      - sentences:
          - "[(watch | open | start)] (Kodi | Cody)"
  
  WatchMax:
    data:
      - sentences:
          - "[(watch | open | start)] (Max | HBO)"
  
  WatchNetflix:
    data:
      - sentences:
          - "[(watch | open | start)] Netflix"
  
  WatchParamountPlus:
    data:
      - sentences:
          - "[(watch | open | start)] Paramount [Plus]"
  
  WatchPeacock:
    data:
      - sentences:
          - "[(watch | open | start)] Peacock"
  
  WatchVideos:
    data:
      - sentences:
          - "(watch | play) videos"
