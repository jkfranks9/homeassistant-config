substitutions:
  friendly_name:    Energy Mon 2
  
  # Used by boards
  device_name:      energy-mon-2
  loglevel:         DEBUG
  
  # Used by WiFi and sensors
  update_interval:  10s

  # Current Transformers:
  #  20A/25mA SCT-006: 11143
  #  30A/1V SCT-013-030: 8650
  #  50A/1V SCT-013-050: 15420
  #  50A/16.6mA SCT-010: 41334
  #  80A/26.6mA SCT-010: 41660
  #  100A/50ma SCT-013-000: 27518
  #  120A/40mA: SCT-016: 41787
  #  200A/100mA SCT-024: 27518
  #  200A/50mA SCT-024: 55036
  SCT_006_cal: '11143'
  SCT_010_cal: '41660'
  SCT_013_cal: '27518'

  # Jameco 9VAC Transformer: 
  #  For meter versions: 
  #  >= v1.3: 7305
  voltage_cal: '7305'

# Pull in common configuration
packages:
  esp32_base: !include common/esp32_base.yaml
  wifi:       !include common/wifi.yaml

# Enable Home Assistant API
api:
  encryption:
    key: !secret energy_monitor_api_key

# WiFi credentials
wifi:
  ssid:     !secret wifi_ssid
  password: !secret wifi_password

# SPI is needed for the 6 channel energy monitor
spi:
  clk_pin: 18
  miso_pin: 19
  mosi_pin: 23

# Create persistent global variables in flash memory to survive reboots.
globals:
  - id: bed_bath_energy_total
    type: float
    restore_value: true
    initial_value: '0.0'
  
  - id: theater_hall_energy_total
    type: float
    restore_value: true
    initial_value: '0.0'
  
  - id: snack_bar_energy_total
    type: float
    restore_value: true
    initial_value: '0.0'
  
  - id: air_handler_energy_total
    type: float
    restore_value: true
    initial_value: '0.0'
  
  - id: utility_1_energy_total
    type: float
    restore_value: true
    initial_value: '0.0'
  
  - id: utility_2_energy_total
    type: float
    restore_value: true
    initial_value: '0.0'
  
  - id: total_energy_total
    type: float
    restore_value: true
    initial_value: '0.0'

# Sensors
sensor:

  #===============================#
  #     Energy Monitor Device     #
  #===============================#

  # There are 2 ICs on the energy monitor. Each one handles 3 of the 6 energy monitoring channels.
  # They are referred to as "phases".

  # IC1 ... the board allows for two separate voltages to be measured, but we only need one. It's configured
  # on the first phase of IC1.
  - platform: atm90e32
    cs_pin:
      number: 5
      ignore_strapping_warning: true
    
    phase_a:
      # voltage:
        # name: Volts A
        # id: ic1Volts
        # accuracy_decimals: 1

      # The max value for current that the meter can output is 65.535. If you expect to measure current over 65A, 
      # divide the gain_ct by 2 (120A CT) or 4 (200A CT) and multiply the current and power values by 2 or 4 by uncommenting the filter below
      #        filters:
      #          - multiply: 2
      power:
        id: ct1Watts
      #        filters:
      #          - multiply: 2
      gain_voltage: ${voltage_cal}
      gain_ct: ${SCT_006_cal}
    
    phase_b:
      power:
        id: ct2Watts
      gain_voltage: ${voltage_cal}
      gain_ct: ${SCT_006_cal}
    
    phase_c:
      power:
        id: ct3Watts
      gain_voltage: ${voltage_cal}
      gain_ct: ${SCT_010_cal}
    
    line_frequency: 60Hz
    gain_pga: 1X
    update_interval: ${update_interval}

  # IC2
  - platform: atm90e32
    cs_pin: 4
    
    phase_a:
      # This voltage is only needed if monitoring 2 voltages
      #      voltage:
      #        name: Volts B
      #        id: ic2Volts
      #        accuracy_decimals: 1
      
      # This is the upstairs air handler. I currently only have one CT clamp, so am doubling the 
      # values to compensate, as per Circuit Setup instructions.
      power:
        id: ct4Watts
        filters:
          - multiply: 2
      gain_voltage: ${voltage_cal}
      gain_ct: ${SCT_013_cal}
    
    phase_b:
      power:
        id: ct5Watts
      gain_voltage: ${voltage_cal}
      gain_ct: ${SCT_010_cal}
    
    phase_c:
      power:
        id: ct6Watts
      gain_voltage: ${voltage_cal}
      gain_ct: ${SCT_010_cal}
    
    line_frequency: 60Hz
    gain_pga: 1X
    update_interval: ${update_interval}

  # Total Watts
  - platform: template
    id: totalWatts
    lambda: return id(ct1Watts).state + id(ct2Watts).state + id(ct3Watts).state + id(ct4Watts).state + id(ct5Watts).state + id(ct6Watts).state ;
    accuracy_decimals: 1
    unit_of_measurement: W
    device_class: power
    update_interval: ${update_interval}

  #=================================#
  #     Raw Integration Sensors     #
  #=================================#

  # These are hidden from Home Assistant by having an id instead of a name.
  - platform: integration
    id: bed_bath_energy_raw
    sensor: ct1Watts
    time_unit: h
    integration_method: left
    filters:
      - multiply: 0.001

  - platform: integration
    id: theater_hall_energy_raw
    sensor: ct2Watts
    time_unit: h
    integration_method: left
    filters:
      - multiply: 0.001

  - platform: integration
    id: snack_bar_energy_raw
    sensor: ct3Watts
    time_unit: h
    integration_method: left
    filters:
      - multiply: 0.001

  - platform: integration
    id: air_handler_energy_raw
    sensor: ct4Watts
    time_unit: h
    integration_method: left
    filters:
      - multiply: 0.001

  - platform: integration
    id: utility_1_energy_raw
    sensor: ct5Watts
    time_unit: h
    integration_method: left
    filters:
      - multiply: 0.001

  - platform: integration
    id: utility_2_energy_raw
    sensor: ct6Watts
    time_unit: h
    integration_method: left
    filters:
      - multiply: 0.001

  - platform: integration
    id: total_energy_raw
    sensor: totalWatts
    time_unit: h
    integration_method: left
    filters:
      - multiply: 0.001

  # Expose persistent template sensors to Home Assistant that absorb reboots safely.
  - platform: template
    name: "Bed & Bath Energy"
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 3
    lambda: |-
      static float last_raw = 0.0;
      float current_raw = id(bed_bath_energy_raw).state;
      if (std::isnan(current_raw)) return id(bed_bath_energy_total);
      
      if (current_raw >= last_raw) {
        id(bed_bath_energy_total) += (current_raw - last_raw);
      } else {
        // Device rebooted; raw integration dropped back to 0. 
        // Add the new raw total directly since it started from 0.
        id(bed_bath_energy_total) += current_raw;
      }
      last_raw = current_raw;
      return id(bed_bath_energy_total);

  - platform: template
    name: "Theater & Hall Energy"
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 3
    lambda: |-
      static float last_raw = 0.0;
      float current_raw = id(theater_hall_energy_raw).state;
      if (std::isnan(current_raw)) return id(theater_hall_energy_total);
      
      if (current_raw >= last_raw) {
        id(theater_hall_energy_total) += (current_raw - last_raw);
      } else {
        // Device rebooted; raw integration dropped back to 0. 
        // Add the new raw total directly since it started from 0.
        id(theater_hall_energy_total) += current_raw;
      }
      last_raw = current_raw;
      return id(theater_hall_energy_total);

  - platform: template
    name: "Snack Bar Energy"
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 3
    lambda: |-
      static float last_raw = 0.0;
      float current_raw = id(snack_bar_energy_raw).state;
      if (std::isnan(current_raw)) return id(snack_bar_energy_total);
      
      if (current_raw >= last_raw) {
        id(snack_bar_energy_total) += (current_raw - last_raw);
      } else {
        // Device rebooted; raw integration dropped back to 0. 
        // Add the new raw total directly since it started from 0.
        id(snack_bar_energy_total) += current_raw;
      }
      last_raw = current_raw;
      return id(snack_bar_energy_total);

  - platform: template
    name: "Air Handler Energy"
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 3
    lambda: |-
      static float last_raw = 0.0;
      float current_raw = id(air_handler_energy_raw).state;
      if (std::isnan(current_raw)) return id(air_handler_energy_total);
      
      if (current_raw >= last_raw) {
        id(air_handler_energy_total) += (current_raw - last_raw);
      } else {
        id(air_handler_energy_total) += current_raw;
      }
      last_raw = current_raw;
      return id(air_handler_energy_total);

  - platform: template
    name: "Utility 1 Energy"
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 3
    lambda: |-
      static float last_raw = 0.0;
      float current_raw = id(utility_1_energy_raw).state;
      if (std::isnan(current_raw)) return id(utility_1_energy_total);
      
      if (current_raw >= last_raw) {
        id(utility_1_energy_total) += (current_raw - last_raw);
      } else {
        id(utility_1_energy_total) += current_raw;
      }
      last_raw = current_raw;
      return id(utility_1_energy_total);

  - platform: template
    name: "Utility 2 Energy"
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 3
    lambda: |-
      static float last_raw = 0.0;
      float current_raw = id(utility_2_energy_raw).state;
      if (std::isnan(current_raw)) return id(utility_2_energy_total);
      
      if (current_raw >= last_raw) {
        id(utility_2_energy_total) += (current_raw - last_raw);
      } else {
        id(utility_2_energy_total) += current_raw;
      }
      last_raw = current_raw;
      return id(utility_2_energy_total);

  - platform: template
    name: "Total Energy"
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 3
    lambda: |-
      static float last_raw = 0.0;
      float current_raw = id(total_energy_raw).state;
      if (std::isnan(current_raw)) return id(total_energy_total);
      
      if (current_raw >= last_raw) {
        id(total_energy_total) += (current_raw - last_raw);
      } else {
        id(total_energy_total) += current_raw;
      }
      last_raw = current_raw;
      return id(total_energy_total);

# This is needed for the Home Assistant energy dashboard.
time:
  - platform: sntp
    id: sntp_time   

# Restart switch
switch:
  - platform: restart
    name: Restart
