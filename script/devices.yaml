#====================#
#     Tower Fans     #
#====================#

set_penthouse_tower_fan_to_fixed_low:
  alias: Set Penthouse Tower Fan To Fixed Low
  
  sequence:
    - action: script.set_dreo_tower_fan_to_preset
      data:
        fan_entity: fan.penthouse_tower_fan
        mode: fixed
        speed: low

set_penthouse_tower_fan_to_fixed_medium:
  alias: Set Penthouse Tower Fan To Fixed Medium
  
  sequence:
    - action: script.set_dreo_tower_fan_to_preset
      data:
        fan_entity: fan.penthouse_tower_fan
        mode: fixed
        speed: medium

set_penthouse_tower_fan_to_fixed_high:
  alias: Set Penthouse Tower Fan To Fixed High
  
  sequence:
    - action: script.set_dreo_tower_fan_to_preset
      data:
        fan_entity: fan.penthouse_tower_fan
        mode: fixed
        speed: high

set_penthouse_tower_fan_to_horizontal_low:
  alias: Set Penthouse Tower Fan To Horizontal Low
  
  sequence:
    - action: script.set_dreo_tower_fan_to_preset
      data:
        fan_entity: fan.penthouse_tower_fan
        mode: horizontal
        speed: low

set_penthouse_tower_fan_to_horizontal_medium:
  alias: Set Penthouse Tower Fan To Horizontal Medium
  
  sequence:
    - action: script.set_dreo_tower_fan_to_preset
      data:
        fan_entity: fan.penthouse_tower_fan
        mode: horizontal
        speed: medium

set_penthouse_tower_fan_to_horizontal_high:
  alias: Set Penthouse Tower Fan To Horizontal High
  
  sequence:
    - action: script.set_dreo_tower_fan_to_preset
      data:
        fan_entity: fan.penthouse_tower_fan
        mode: horizontal
        speed: high

# Turn on a Dreo tower fan using a preset mode. The preset is not integral to the fan, but a collection
# of values determined by me.
#
# NOTE: We have per fan preferences for the values used here, but there are hardcoded defaults in this script
# in the unlikely event that any of the preference entity states are not valid.
set_dreo_tower_fan_to_preset:
  alias: Set Dreo Tower Fan To Preset
  
  fields:
    fan_entity:
      description: The target tower fan.
      selector:
        entity:
          domain: fan
    
    mode:
      description: The desired fan preset mode.
      selector:
        select:
          options:
            - fixed
            - horizontal
    
    speed:
      description: The desired fan preset speed.
      selector:
        select:
          options:
            - low
            - medium
            - high
    
  variables:
      
    # Fan name. We require all entities we use to have the fan entity name as part of their
    # own entity name. For example:
    #
    # Input fan entity: fan.penthouse_tower_fan
    # Fan entity containing the horizontal angle: number.penthouse_tower_fan_fan_angle_horizontal
    # Our configured value for the horizontal angle: input_number.penthouse_tower_fan_horizontal_angle
    fan_name: "{{ fan_entity.split('.')[1] }}"
    
    # Default speed integer, in case the preference entity state is not valid.
    default_speed_number: "{{ iif(speed == 'low', 3, iif(speed == 'high', 8, 5)) }}"
      
    # The speed range of the fans is 1-9, so we need to multiply by 11 to get the proper percentage.
    speed_percentage: "{{ (states('input_number.' ~ fan_name ~ '_speed_' ~ speed) | int(default_speed_number)) * 11 }}"
    
  sequence:
      
    # For some reason most of the fan entities we set here are unavailable when the fan is off, so make sure it's on first.
    - if:
        - "{{ is_state(fan_entity, 'off') }}"
      
      then:    
        - action: fan.turn_on
          target:
            entity_id: "{{ fan_entity }}"
      
    # Always use the normal preset mode.
    - action: fan.set_preset_mode
      target:
        entity_id: "{{ fan_entity }}"
      data:
        preset_mode: Normal
      
    # Set the speed.
    - action: fan.set_percentage
      target:
        entity_id: "{{ fan_entity }}"
      data:
        percentage: "{{ speed_percentage }}"
      
    # Set the oscillation mode, either fixed or horizontal.
    - action: select.select_option
      target:
        entity_id: "{{ 'select.' ~ fan_name ~ '_oscillation_direction' }}"
      data:
        option: "{{ mode | title }}"
      
    # We seem to need a short delay.
    - delay: 1
    
    # Set options per the oscillation mode.
    - choose:
      - conditions: "{{ mode == 'fixed' }}"
        
        # For fixed mode we set the horizontal and vertical angles.
        sequence:
          - action: number.set_value
            target:
              entity_id: "{{ 'number.' ~ fan_name ~ '_fan_angle_horizontal' }}"
            data:
              value: "{{ states('input_number.' ~ fan_name ~ '_horizontal_angle') | int(15) }}"
        
          - action: number.set_value
            target:
              entity_id: "{{ 'number.' ~ fan_name ~ '_fan_angle_vertical' }}"
            data:
              value: "{{ states('input_number.' ~ fan_name ~ '_vertical_angle') | int(-10) }}"
        
      - conditions: "{{ mode == 'horizontal' }}"
        
        # For horizontal mode we set the left and right oscillation range.
        sequence:
          - action: number.set_value
            target:
              entity_id: "{{ 'number.' ~ fan_name ~ '_fan_osc_range_left' }}"
            data:
              value: "{{ states('input_number.' ~ fan_name ~ '_osc_range_left') | int(-15) }}"
        
          - action: number.set_value
            target:
              entity_id: "{{ 'number.' ~ fan_name ~ '_fan_osc_range_right' }}"
            data:
              value: "{{ states('input_number.' ~ fan_name ~ '_osc_range_right') | int(15) }}"

#======================#
#     Ceiling Fans     #
#======================#

# Set a ceiling fan to a given speed.
set_fan_to_speed:
  alias: Set Fan To Speed
  
  fields:
    entity_id:
      description: 'The target ceiling fan.'
    
    speed:
      description: 'The desired fan speed (0 = off, 33 = low, 66 = medium, 99 = high).'
  
  variables:
    fan_name: "{{ entity_id.split('.')[1] }}"
    automatic_toggle_entity: "{{ 'input_boolean.' ~ fan_name ~ '_automatic' }}"
    fan_speed_entity: "{{ 'input_number.' ~ (state_attr(entity_id, 'friendly_name') | replace(' ', '_') | lower) ~ '_speed' }}"
    speed_name: "{{ iif(speed == 0, 'off', iif(speed == 33, 'low', iif(speed == 66, 'medium', iif(speed == 99, 'high', speed)))) }}"
  
  sequence:
    
    # Don't set the speed if the fan is already at the desired speed.
    - if:
        - "{{ states(fan_speed_entity) | int(0) != speed }}"
      
      then:    
        # Set the fan to the specified speed. 
        - action: fan.turn_on
          target:
            entity_id: "{{ entity_id }}"
          data:
            percentage: "{{ speed }}"
    
        - action: system_log.write
          data:
            message: "{{ fan_name ~ ' set to ' ~ speed_name }}"
            level: info
    
        # To calculate estimated power consumption, we need to keep track of the specified speed. We do this
        # using a unique input number for each fan. Lovely.
        - action: input_number.set_value
          target:
            entity_id: "{{ fan_speed_entity }}"
          data:
            value: "{{ speed }}"
    
    # Turn off the automatic control toggle if the fan was just turned off.
    - if:
        - "{{ speed == 0 }}"
      
      then:
          
        - action: input_boolean.turn_off
          target:
            entity_id: "{{ automatic_toggle_entity }}"

# Control a fan based on temperature.
control_fan_for_temperature:
  alias: Control Fan For Temperature
  mode: queued
  
  fields:
    fan_entity_id:
      description: 'The target fan.'
      selector:
        entity:
          domain: fan
    
    temperature_entity_id:
      description: 'The temperature sensor.'
      selector:
        entity:
          domain: sensor
    
    activity:
      name: Activity
      description: The reason (type of activity) for controlling the fan. Some activities require higher fan speeds than normal.
      selector:
        select:
          options:
            - normal
            - treadmill_cooldown
            - yard_work_cooldown
    
    timeout:
      description: 'Time to leave the fan on, in seconds. Zero means no timeout.'
  
  sequence:
    - variables:
        fan_name: "{{ fan_entity_id.split('.')[1] }}"
        automatic_toggle_entity: "{{ 'input_boolean.' ~ fan_name ~ '_automatic' }}"
        speed_entity: "{{ 'input_number.' ~ fan_name ~ '_speed' }}"
      
        # Speed thresholds, based on the input activity.        
        high_threshold: "{{ states('input_number.' ~ fan_name ~ '_' ~ activity ~ '_high_threshold') | float(0) }}"
        med_threshold:  "{{ states('input_number.' ~ fan_name ~ '_' ~ activity ~ '_medium_threshold') | float(0) }}"
        low_threshold:  "{{ states('input_number.' ~ fan_name ~ '_' ~ activity ~ '_low_threshold') | float(0) }}"
    
    # Set the fan to a speed based on the temperature.
    - choose:
      - conditions: "{{ states(temperature_entity_id) | float(0) >= high_threshold }}"
      
        sequence:
          - action: script.set_fan_to_speed
            data:
              entity_id: "{{ fan_entity_id }}"
              speed: 99
      
      - conditions: "{{ states(temperature_entity_id) | float(0) >= med_threshold }}"
      
        sequence:
          - action: script.set_fan_to_speed
            data:
              entity_id: "{{ fan_entity_id }}"
              speed: 66
      
      - conditions: "{{ states(temperature_entity_id) | float(0) >= low_threshold }}"
      
        sequence:
          - action: script.set_fan_to_speed
            data:
              entity_id: "{{ fan_entity_id }}"
              speed: 33
      
      default:
        - action: script.set_fan_to_speed
          data:
            entity_id: "{{ fan_entity_id }}"
            speed: 0
    
    # Indicate whether or not the fan is under automatic control; true if the fan has been turned on for 
    # normal activity. Note that fan voice control uses the Set Fan To Speed script directly, bypassing
    # this script.
    - variables:
        fan_speed: "{{ states(speed_entity) | int(0) }}"
        operation: "{{ iif(fan_speed > 0 and activity == 'normal', 'on', 'off') }}"
          
    - action: input_boolean.turn_{{ operation }}
      target:
        entity_id: "{{ automatic_toggle_entity }}"
    
    # Continue if a valid timeout is specified.
    - condition: "{{ timeout > 0 if is_number(timeout) }}"
    
    # Delay for the timeout period.
    - delay: "{{ timeout }}" 
    
    # Then turn the fan off.
    - action: script.set_fan_to_speed
      data:
        entity_id: "{{ fan_entity_id }}"
        speed: 0

# Turn off ceiling fans identified by a list of labels. We want to use the Set Fan To Speed script,
# and not just turn off the fans, because the script includes additional functions.
turn_off_ceiling_fans:
  alias: Turn Off Ceiling Fans
  
  fields:
    labels:
      description: A list of labels that identify groups of ceiling fans.
      selector:
        label:
  
  sequence:
    
    # Process all labels.
    - repeat:
        for_each: "{{ labels }}"
        
        sequence:
          - variables:
              label: "{{ repeat.item }}"
    
          # Process all fans included in the current label.
          - repeat:
              for_each: "{{ label_entities(label) }}"
                
              sequence:
                - action: script.set_fan_to_speed
                  data:
                    entity_id: "{{ repeat.item }}"
                    speed: 0

#=========================#
#     Generic Buttons     #
#=========================#

# Process a Sonoff 4-way button press.
process_4_way_button_actions:
  alias: Process 4-Way Button Actions
  
  fields:
    device_name:
      description: The button device name, used to identify the unique processing required.
      
    button:
      description: The button number that was pressed.
      selector:
        number:
          min: 1
          max: 4
      
    action:
      description: The button action.
      selector:
        select:
          options:
            - single
            - double
            - triple
            - long
  
  sequence:
    
    # Process according to the device name. The response variable indicates whether or not the button & action
    # were recognized and handled. If not, we just log the button press for posterity.
    - choose:
        
      # Main downstairs button.
      - conditions: "{{ device_name == 'Main 4 Way Button' }}"
        
        sequence:
          - action: script.process_main_4_way_button_actions
            data:
              button: "{{ button }}"
              action: "{{ action }}"
            response_variable: result
        
      # Penthouse button.
      - conditions: "{{ device_name == 'Penthouse 4 Way Button' }}"
        
        sequence:
          - action: script.process_penthouse_4_way_button_actions
            data:
              button: "{{ button }}"
              action: "{{ action }}"
            response_variable: result
        
      # Studio button.
      - conditions: "{{ device_name == 'Studio 4 Way Button' }}"
        
        sequence:
          - action: script.process_studio_4_way_button_actions
            data:
              button: "{{ button }}"
              action: "{{ action }}"
            response_variable: result
        
    # Pick up the handled result, and log if it's false.
    - variables:
        handled: "{{ result.handled }}"
    
    - if:
        - "{{ handled == false }}"
      
      then:
        - action: system_log.write
          data:
            message: "{{ device_name ~ ' ' ~ button ~ ', ' ~ action ~ ' press' }}"
            level: info

# Process the main downstairs button actions.
process_main_4_way_button_actions:
  alias: Process Main 4-Way Button Actions
  
  fields:
    button:
      description: The button number that was pressed.
      selector:
        number:
          min: 1
          max: 4
      
    action:
      description: The button action.
      selector:
        select:
          options:
            - single
            - double
            - triple
            - long
  
  sequence:
    
    # Assume we're going to handle the input. If not, we set this false in the default clause.
    - variables:
        handled: true
    
    # Process the input.
    - choose:
      
      #----- Button 1 -----#
        
      # Single push
      - conditions: "{{ button == 1 and action == 'single' }}"
        
        sequence:
          - variables:
              domain: fan
              name: family_room_fan
              speed: 33
      
      # Double push
      - conditions: "{{ button == 1 and action == 'double' }}"
        
        sequence:
          - variables:
              domain: fan
              name: family_room_fan
              speed: 66
      
      # Triple push
      - conditions: "{{ button == 1 and action == 'triple' }}"
        
        sequence:
          - variables:
              domain: fan
              name: family_room_fan
              speed: 99
      
      # Long push
      - conditions: "{{ button == 1 and action == 'long' }}"
        
        sequence:
          - variables:
              domain: fan
              name: family_room_fan
              speed: 0
      
      #----- Button 2 -----#
      
      # Single push
      - conditions: "{{ button == 2 and action == 'single' }}"
        
        sequence:
          - variables:
              domain: fan
              name: office_fan
              speed: 33
      
      # Double push
      - conditions: "{{ button == 2 and action == 'double' }}"
        
        sequence:
          - variables:
              domain: fan
              name: office_fan
              speed: 66
      
      # Triple push
      - conditions: "{{ button == 2 and action == 'triple' }}"
        
        sequence:
          - variables:
              domain: fan
              name: office_fan
              speed: 99
      
      # Long push
      - conditions: "{{ button == 2 and action == 'long' }}"
        
        sequence:
          - variables:
              domain: fan
              name: office_fan
              speed: 0
        
      default:
        - variables:
            handled: false
    
    # Pick up the result.
    - variables:
        result: "{{ {'handled': handled} }}"
    
    # Perform the required implementation if we recognized the input.
    - if:
        - "{{ handled == true }}"
      
      then:
    
        # Implementation for all actions that just set variables above.
        - choose:
            
          # Operate a ceiling fan.
          - conditions: "{{ domain == 'fan' }}"
              
            sequence:
              - action: script.set_fan_to_speed
                data:
                  entity_id: "{{ domain ~ '.' ~ name }}"
                  speed: "{{ speed }}"
        
    # Return the result.
    - stop: "Returning result"
      response_variable: result

# Process the penthouse button actions.
process_penthouse_4_way_button_actions:
  alias: Process Penthouse 4-Way Button Actions
  
  fields:
    button:
      description: The button number that was pressed.
      selector:
        number:
          min: 1
          max: 4
      
    action:
      description: The button action.
      selector:
        select:
          options:
            - single
            - double
            - triple
            - long
  
  sequence:
    
    # Assume we're going to handle the input. If not, we set this false in the default clause.
    - variables:
        handled: true
    
    # Process the input.
    - choose:
      
      #----- Button 1 -----#
        
      # Single push
      - conditions: "{{ button == 1 and action == 'single' }}"
        
        sequence:
          - variables:
              domain: fan
              name: penthouse_tower_fan
              mode: fixed
              speed: low
      
      # Double push
      - conditions: "{{ button == 1 and action == 'double' }}"
        
        sequence:
          - variables:
              domain: fan
              name: penthouse_tower_fan
              mode: fixed
              speed: medium
      
      # Triple push
      - conditions: "{{ button == 1 and action == 'triple' }}"
        
        sequence:
          - variables:
              domain: fan
              name: penthouse_tower_fan
              mode: fixed
              speed: high
      
      # Long push
      - conditions: "{{ button == 1 and action == 'long' }}"
        
        sequence:
          - variables:
              domain: fan
              name: penthouse_tower_fan
              mode: 'off'
      
      #----- Button 2 -----#
        
      # Single push
      - conditions: "{{ button == 2 and action == 'single' }}"
        
        sequence:
          - variables:
              domain: fan
              name: penthouse_tower_fan
              mode: horizontal
              speed: low
      
      # Double push
      - conditions: "{{ button == 2 and action == 'double' }}"
        
        sequence:
          - variables:
              domain: fan
              name: penthouse_tower_fan
              mode: horizontal
              speed: medium
      
      # Triple push
      - conditions: "{{ button == 2 and action == 'triple' }}"
        
        sequence:
          - variables:
              domain: fan
              name: penthouse_tower_fan
              mode: horizontal
              speed: high
      
      # Long push
      - conditions: "{{ button == 2 and action == 'long' }}"
        
        sequence:
          - variables:
              domain: fan
              name: penthouse_tower_fan
              mode: 'off'
      
      #----- Button 3 -----#
      
      # Single push
      - conditions: "{{ button == 3 and action == 'single' }}"
        
        sequence:
            
          # The bedroom lamp doubles as a normal light or a night light. This action is to toggle the normal light,
          # so we need to turn it on (as normal) if it's currently off or if it's currently in night mode. If it's currently
          # in normal mode, we want to turn it off.
          - if:
              - "{{ is_state('light.penthouse_bedroom_lamp', 'off') or state_attr('light.penthouse_bedroom_lamp', 'brightness') | int(0) < 100 }}"
              
            then:
              - action: script.turn_on_penthouse_bedroom_lamp
                data:
                  profile: normal
              
            else:
              - action: light.turn_off
                target:
                  entity_id: light.penthouse_bedroom_lamp
      
      # Double push
      - conditions: "{{ button == 3 and action == 'double' }}"
        
        sequence:
            
          # The bedroom lamp doubles as a normal light or a night light. This action is to toggle the night light,
          # so we need to turn it on (as night) if it's currently off or if it's currently in normal mode. If it's currently
          # in night mode, we want to turn it off.
          - if:
              - "{{ is_state('light.penthouse_bedroom_lamp', 'off') or state_attr('light.penthouse_bedroom_lamp', 'brightness') | int(0) > 100 }}"
              
            then:
              - action: script.turn_on_penthouse_bedroom_lamp
                data:
                  profile: night
              
            else:
              - action: light.turn_off
                target:
                  entity_id: light.penthouse_bedroom_lamp
        
      default:
        - variables:
            handled: false
    
    # Pick up the result.
    - variables:
        result: "{{ {'handled': handled} }}"
    
    # Perform the required implementation if we recognized the input.
    - if:
        - "{{ handled == true }}"
      
      then:
    
        # Implementation for all actions that just set variables above.
        - choose:
        
          # Operate a tower fan.
          - conditions: "{{ domain == 'fan' }}"
              
            sequence:
              - variables:
                  fan_entity: "{{ domain ~ '.' ~ name }}"
                
              - if:
                  - "{{ mode != 'off' }}"
                  
                then:
                  - action: script.set_dreo_tower_fan_to_preset
                    data:
                      fan_entity: "{{ fan_entity }}"
                      mode: "{{ mode }}"
                      speed: "{{ speed }}"
                  
                else:
                  - action: fan.turn_off
                    target:
                      entity_id: "{{ fan_entity }}"
        
    # Return the result.
    - stop: "Returning result"
      response_variable: result

# Process the studio button actions.
process_studio_4_way_button_actions:
  alias: Process Studio 4-Way Button Actions
  
  fields:
    button:
      description: The button number that was pressed.
      selector:
        number:
          min: 1
          max: 4
      
    action:
      description: The button action.
      selector:
        select:
          options:
            - single
            - double
            - triple
            - long
  
  sequence:
    
    # Assume we're going to handle the input. If not, we set this false in the default clause.
    - variables:
        handled: true
    
    # Process the input.
    - choose:
      
      #----- Button 1 -----#
        
      # Single push
      - conditions: "{{ button == 1 and action == 'single' }}"
        
        sequence:
          - variables:
              domain: light
              name: studio_side_window_lamp
              operation: toggle
      
      # Double push
      - conditions: "{{ button == 1 and action == 'double' }}"
        
        sequence:
            
          # The front window lamp doubles as a normal light or a night light. This action is to toggle the normal light,
          # so we need to turn it on (as normal) if it's currently off or if it's currently in night mode. If it's currently
          # in normal mode, we want to turn it off.
          - if:
              - "{{ is_state('light.studio_front_window_lamp', 'off') or state_attr('light.studio_front_window_lamp', 'brightness') | int(0) < 100 }}"
              
            then:
              - action: script.turn_on_studio_front_window_lamp
                data:
                  profile: normal
              
            else:
              - action: light.turn_off
                target:
                  entity_id: light.studio_front_window_lamp
      
      # Triple push
      - conditions: "{{ button == 1 and action == 'triple' }}"
        
        sequence:
            
          # The front window lamp doubles as a normal light or a night light. This action is to toggle the night light,
          # so we need to turn it on (as night) if it's currently off or if it's currently in normal mode. If it's currently
          # in night mode, we want to turn it off.
          - if:
              - "{{ is_state('light.studio_front_window_lamp', 'off') or state_attr('light.studio_front_window_lamp', 'brightness') | int(0) > 100 }}"
              
            then:
              - action: script.turn_on_studio_front_window_lamp
                data:
                  profile: night
              
            else:
              - action: light.turn_off
                target:
                  entity_id: light.studio_front_window_lamp
      
      # Long push
      - conditions: "{{ button == 1 and action == 'long' }}"
        
        sequence:
          - variables:
              domain: light
              name: studio_hall_ceiling
              operation: toggle
      
      #----- Button 2 -----#
      
      # Single push
      - conditions: "{{ button == 2 and action == 'single' }}"
        
        sequence:
            
          # Turn on the preferred studio night lights.
          - action: script.operate_preferred_studio_lights
            data:
              operation: 'on'
              profile: night
      
      # Double push
      - conditions: "{{ button == 2 and action == 'double' }}"
        
        sequence:
            
          # Turn off the preferred studio night lights.
          - action: script.operate_preferred_studio_lights
            data:
              operation: 'off'
              profile: night
      
      #----- Button 3 -----#
      
      # Single push
      - conditions: "{{ button == 3 and action == 'single' }}"
        
        sequence:
          - variables:
              operation: select_preference
              pref_entity: 'input_select.preferred_studio_normal_lights'
              option: 'Side Window'
      
      # Double push
      - conditions: "{{ button == 3 and action == 'double' }}"
        
        sequence:
          - variables:
              operation: select_preference
              pref_entity: 'input_select.preferred_studio_normal_lights'
              option: 'Front Window'
      
      # Triple push
      - conditions: "{{ button == 3 and action == 'triple' }}"
        
        sequence:
          - variables:
              operation: select_preference
              pref_entity: 'input_select.preferred_studio_normal_lights'
              option: 'Both'
      
      # Long push
      - conditions: "{{ button == 3 and action == 'long' }}"
        
        sequence:
          - variables:
              operation: select_preference
              pref_entity: 'input_select.preferred_studio_normal_lights'
              option: 'Neither'
      
      #----- Button 4 -----#
      
      # Single push
      - conditions: "{{ button == 4 and action == 'single' }}"
        
        sequence:
          - variables:
              operation: select_preference
              pref_entity: 'input_select.preferred_studio_night_lights'
              option: 'Front Window'
      
      # Double push
      - conditions: "{{ button == 4 and action == 'double' }}"
        
        sequence:
          - variables:
              operation: select_preference
              pref_entity: 'input_select.preferred_studio_night_lights'
              option: 'Hall Ceiling'
      
      # Triple push
      - conditions: "{{ button == 4 and action == 'triple' }}"
        
        sequence:
          - variables:
              operation: select_preference
              pref_entity: 'input_select.preferred_studio_night_lights'
              option: 'Both'
      
      # Long push
      - conditions: "{{ button == 4 and action == 'long' }}"
        
        sequence:
          - variables:
              operation: select_preference
              pref_entity: 'input_select.preferred_studio_night_lights'
              option: 'Neither'
        
      default:
        - variables:
            handled: false
    
    # Pick up the result.
    - variables:
        result: "{{ {'handled': handled} }}"
    
    # Perform the required implementation if we recognized the input.
    - if:
        - "{{ handled == true }}"
      
      then:
    
        # Implementation for all actions that just set variables above.
        - choose:
        
          # Toggle a light. Note that we specify full brightness. The only lights that are toggled here
          # are the side window lamp (which doesn't support brightness), and the hall ceiling light. For the
          # latter it makes sense to turn it fully on, because we have a mechanism (button 2 single push) to
          # operate it as a night light. I don't really like this, but oh well.
          - conditions: "{{ operation == 'toggle' }}"
              
            sequence:
              - action: light.toggle
                target:
                  entity_id: "{{ domain ~ '.' ~ name }}"
                data:
                  brightness_pct: 100
            
          # Select a lighting preference.
          - conditions: "{{ operation == 'select_preference' }}"
            
            sequence:
              - variables:
                  current_state: "{{ states(pref_entity) }}"
                  msg_subject: "{{ iif('normal' in pref_entity.split('.')[1].split('_'), 'Normal', 'Night') }}"
                  msg_verbage: "{{ iif(current_state == option, 'already set', 'changed') }}"
                
              # No need to change anything if the current option is the one we want.
              - if:
                  - "{{ current_state != option }}"
                  
                then:
                  - action: input_select.select_option
                    target:
                      entity_id: "{{ pref_entity }}"
                    data:
                      option: "{{ option }}"
                
              # Tell the user what happened.
              - action: script.send_notification
                data:
                  destination:
                    - voice_assistant
                  message: "{{ msg_subject ~ ' light preference ' ~ msg_verbage ~ ' to ' ~ option }}"
                  room: ['studio']
                  voice_type: announce
        
    # Return the result.
    - stop: "Returning result"
      response_variable: result
