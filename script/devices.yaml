#====================#
#     Tower Fans     #
#====================#

set_penthouse_tower_fan_to_fixed_low:
  alias: Set Penthouse Tower Fan To Fixed Low
  
  sequence:
    - action: script.set_dreo_tower_fan_to_preset
      data:
        fan_entity: fan.penthouse_tower_fan
        mode: fixed
        speed: low

set_penthouse_tower_fan_to_fixed_medium:
  alias: Set Penthouse Tower Fan To Fixed Medium
  
  sequence:
    - action: script.set_dreo_tower_fan_to_preset
      data:
        fan_entity: fan.penthouse_tower_fan
        mode: fixed
        speed: medium

set_penthouse_tower_fan_to_fixed_high:
  alias: Set Penthouse Tower Fan To Fixed High
  
  sequence:
    - action: script.set_dreo_tower_fan_to_preset
      data:
        fan_entity: fan.penthouse_tower_fan
        mode: fixed
        speed: high

set_penthouse_tower_fan_to_horizontal_low:
  alias: Set Penthouse Tower Fan To Horizontal Low
  
  sequence:
    - action: script.set_dreo_tower_fan_to_preset
      data:
        fan_entity: fan.penthouse_tower_fan
        mode: horizontal
        speed: low

set_penthouse_tower_fan_to_horizontal_medium:
  alias: Set Penthouse Tower Fan To Horizontal Medium
  
  sequence:
    - action: script.set_dreo_tower_fan_to_preset
      data:
        fan_entity: fan.penthouse_tower_fan
        mode: horizontal
        speed: medium

set_penthouse_tower_fan_to_horizontal_high:
  alias: Set Penthouse Tower Fan To Horizontal High
  
  sequence:
    - action: script.set_dreo_tower_fan_to_preset
      data:
        fan_entity: fan.penthouse_tower_fan
        mode: horizontal
        speed: high

# Turn on a Dreo tower fan using a preset mode. The preset is not integral to the fan, but a collection
# of values determined by me.
#
# NOTE: We have per fan preferences for the values used here, but there are hardcoded defaults in this script
# in the unlikely event that any of the preference entity states are not valid.
set_dreo_tower_fan_to_preset:
  alias: Set Dreo Tower Fan To Preset
  
  fields:
    fan_entity:
      description: The target tower fan.
      selector:
        entity:
          domain: fan
    
    mode:
      description: The desired fan preset mode.
      selector:
        select:
          options:
            - fixed
            - horizontal
    
    speed:
      description: The desired fan preset speed.
      selector:
        select:
          options:
            - low
            - medium
            - high
    
  variables:
      
    # Fan name. We require all entities we use to have the fan entity name as part of their
    # own entity name. For example:
    #
    # Input fan entity: fan.penthouse_tower_fan
    # Fan entity containing the horizontal angle: number.penthouse_tower_fan_fan_angle_horizontal
    # Our configured value for the horizontal angle: input_number.penthouse_tower_fan_horizontal_angle
    fan_name: "{{ fan_entity.split('.')[1] }}"
    
    # Default speed integer, in case the preference entity state is not valid.
    default_speed_number: "{{ iif(speed == 'low', 3, iif(speed == 'high', 8, 5)) }}"
      
    # The speed range of the fans is 1-9, so we need to multiply by 11 to get the proper percentage.
    speed_percentage: "{{ (states('input_number.' ~ fan_name ~ '_speed_' ~ speed) | int(default_speed_number)) * 11 }}"
    
  sequence:
      
    # For some reason most of the fan entities we set here are unavailable when the fan is off, so turn it on first.
    - action: fan.turn_on
      target:
        entity_id: "{{ fan_entity }}"
      
    # Always use the normal preset mode.
    - action: fan.set_preset_mode
      target:
        entity_id: "{{ fan_entity }}"
      data:
        preset_mode: Normal
      
    # Set the speed.
    - action: fan.set_percentage
      target:
        entity_id: "{{ fan_entity }}"
      data:
        percentage: "{{ speed_percentage }}"
      
    # Set the oscillation mode, either fixed or horizontal.
    - action: select.select_option
      target:
        entity_id: "{{ 'select.' ~ fan_name ~ '_oscillation_direction' }}"
      data:
        option: "{{ mode | title }}"
      
    # We seem to need a short delay.
    - delay: 1
    
    # Set options per the oscillation mode.
    - choose:
      - conditions: "{{ mode == 'fixed' }}"
        
        # For fixed mode we set the horizontal and vertical angles.
        sequence:
          - action: number.set_value
            target:
              entity_id: "{{ 'number.' ~ fan_name ~ '_fan_angle_horizontal' }}"
            data:
              value: "{{ states('input_number.' ~ fan_name ~ '_horizontal_angle') | int(15) }}"
        
          - action: number.set_value
            target:
              entity_id: "{{ 'number.' ~ fan_name ~ '_fan_angle_vertical' }}"
            data:
              value: "{{ states('input_number.' ~ fan_name ~ '_vertical_angle') | int(-10) }}"
        
      - conditions: "{{ mode == 'horizontal' }}"
        
        # For horizontal mode we set the left and right oscillation range.
        sequence:
          - action: number.set_value
            target:
              entity_id: "{{ 'number.' ~ fan_name ~ '_fan_osc_range_left' }}"
            data:
              value: "{{ states('input_number.' ~ fan_name ~ '_osc_range_left') | int(-20) }}"
        
          - action: number.set_value
            target:
              entity_id: "{{ 'number.' ~ fan_name ~ '_fan_osc_range_right' }}"
            data:
              value: "{{ states('input_number.' ~ fan_name ~ '_osc_range_right') | int(20) }}"

#======================#
#     Ceiling Fans     #
#======================#

# Set a ceiling fan to a given speed.
set_fan_to_speed:
  alias: Set Fan To Speed
  
  fields:
    entity_id:
      description: 'The target ceiling fan.'
    
    speed:
      description: 'The desired fan speed (0 = off, 33 = low, 66 = medium, 99 = high).'
  
  variables:
    fan_name: "{{ entity_id.split('.')[1] }}"
    automatic_toggle_entity: "{{ 'input_boolean.' ~ fan_name ~ '_automatic' }}"
    fan_speed_entity: "{{ 'input_number.' ~ (state_attr(entity_id, 'friendly_name') | replace(' ', '_') | lower) ~ '_speed' }}"
    speed_name: "{{ iif(speed == 0, 'off', iif(speed == 33, 'low', iif(speed == 66, 'medium', iif(speed == 99, 'high', speed)))) }}"
  
  sequence:
    
    # Don't set the speed if the fan is already at the desired speed.
    - if:
        - "{{ states(fan_speed_entity) | int(0) != speed }}"
      
      then:    
        # Set the fan to the specified speed. 
        - action: fan.turn_on
          target:
            entity_id: "{{ entity_id }}"
          data:
            percentage: "{{ speed }}"
    
        - action: system_log.write
          data:
            message: "{{ fan_name ~ ' set to ' ~ speed_name }}"
            level: info
    
        # To calculate estimated power consumption, we need to keep track of the specified speed. We do this
        # using a unique input number for each fan. Lovely.
        - action: input_number.set_value
          target:
            entity_id: "{{ fan_speed_entity }}"
          data:
            value: "{{ speed }}"
    
    # Turn off the automatic control toggle if the fan was just turned off.
    - if:
        - "{{ speed == 0 }}"
      
      then:
          
        - action: input_boolean.turn_off
          target:
            entity_id: "{{ automatic_toggle_entity }}"

# Control a fan based on temperature.
control_fan_for_temperature:
  alias: Control Fan For Temperature
  mode: queued
  
  fields:
    fan_entity_id:
      description: 'The target fan.'
      selector:
        entity:
          domain: fan
    
    temperature_entity_id:
      description: 'The temperature sensor.'
      selector:
        entity:
          domain: sensor
    
    activity:
      name: Activity
      description: The reason (type of activity) for controlling the fan. Some activities require higher fan speeds than normal.
      selector:
        select:
          options:
            - normal
            - treadmill_cooldown
            - yard_work_cooldown
    
    timeout:
      description: 'Time to leave the fan on, in seconds. Zero means no timeout.'
  
  sequence:
    - variables:
        fan_name: "{{ fan_entity_id.split('.')[1] }}"
        automatic_toggle_entity: "{{ 'input_boolean.' ~ fan_name ~ '_automatic' }}"
        speed_entity: "{{ 'input_number.' ~ fan_name ~ '_speed' }}"
      
        # Speed thresholds, based on the input activity.        
        high_threshold: "{{ states('input_number.' ~ fan_name ~ '_' ~ activity ~ '_high_threshold') | float(0) }}"
        med_threshold:  "{{ states('input_number.' ~ fan_name ~ '_' ~ activity ~ '_medium_threshold') | float(0) }}"
        low_threshold:  "{{ states('input_number.' ~ fan_name ~ '_' ~ activity ~ '_low_threshold') | float(0) }}"
    
    # Set the fan to a speed based on the temperature.
    - choose:
      - conditions: "{{ states(temperature_entity_id) | float(0) >= high_threshold }}"
      
        sequence:
          - action: script.set_fan_to_speed
            data:
              entity_id: "{{ fan_entity_id }}"
              speed: 99
      
      - conditions: "{{ states(temperature_entity_id) | float(0) >= med_threshold }}"
      
        sequence:
          - action: script.set_fan_to_speed
            data:
              entity_id: "{{ fan_entity_id }}"
              speed: 66
      
      - conditions: "{{ states(temperature_entity_id) | float(0) >= low_threshold }}"
      
        sequence:
          - action: script.set_fan_to_speed
            data:
              entity_id: "{{ fan_entity_id }}"
              speed: 33
      
      default:
        - action: script.set_fan_to_speed
          data:
            entity_id: "{{ fan_entity_id }}"
            speed: 0
    
    # Indicate whether or not the fan is under automatic control; true if the fan has been turned on for 
    # normal activity. Note that fan voice control uses the Set Fan To Speed script directly, bypassing
    # this script.
    - variables:
        fan_speed: "{{ states(speed_entity) | int(0) }}"
        operation: "{{ iif(fan_speed > 0 and activity == 'normal', 'on', 'off') }}"
          
    - action: input_boolean.turn_{{ operation }}
      target:
        entity_id: "{{ automatic_toggle_entity }}"
    
    # Continue if a valid timeout is specified.
    - condition: "{{ timeout > 0 if is_number(timeout) }}"
    
    # Delay for the timeout period.
    - delay: "{{ timeout }}" 
    
    # Then turn the fan off.
    - action: script.set_fan_to_speed
      data:
        entity_id: "{{ fan_entity_id }}"
        speed: 0

# Turn off ceiling fans identified by a list of labels. We want to use the Set Fan To Speed script,
# and not just turn off the fans, because the script includes additional functions.
turn_off_ceiling_fans:
  alias: Turn Off Ceiling Fans
  
  fields:
    labels:
      description: A list of labels that identify groups of ceiling fans.
      selector:
        label:
  
  sequence:
    
    # Process all labels.
    - repeat:
        for_each: "{{ labels }}"
        
        sequence:
          - variables:
              label: "{{ repeat.item }}"
    
          # Process all fans included in the current label.
          - repeat:
              for_each: "{{ label_entities(label) }}"
                
              sequence:
                - action: script.set_fan_to_speed
                  data:
                    entity_id: "{{ repeat.item }}"
                    speed: 0
