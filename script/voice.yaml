#======================#
#     Ceiling Fans     #
#======================#

# Modify a fan that lives in a room with a voice assistant device.
voice_modify_fan:
  alias: Voice Modify Fan
  
  fields:
    speed:
      name: Speed
      description: Fan speed to be used (see fan_settings variable).
      selector:
        select:
          options:
            - 'off'
            - low
            - medium
            - high
  
  sequence:
    
    # Get the room containing the voice assistant device that was used.
    - action: script.get_voice_device_data
      response_variable: result
    
    - variables:
        
        # Extract the room from the response variable.
        room: "{{ result.room }}"
        
        # This defines the rooms with ceiling fans.
        fan_rooms: "{{ state_attr('sensor.variables', 'variables').fan_rooms }}"
        
        # These are the input speed settings. They are used to index the numerical (percentage)
        # settings below.
        fan_settings: ['off', 'low', 'medium', 'high']
        
        # This is the fan speed for each fan setting.
        fan_speeds: ['0', '33', '66', '99']
    
    # Silently ignore any rooms we don't know about.
    - if:
        - "{{ room in fan_rooms }}"
      
      then:
        
        # Set the fan to the requested speed.
        - action: script.set_fan_to_speed
          data:
            entity_id: "{{ 'fan.' ~ room ~ '_fan' }}"
            speed: "{{ fan_speeds[fan_settings.index(speed)] }}"

#=====================#
#     Room Lights     #
#=====================#

# Toggle a light that lives in a room with a voice assistant device.
voice_operate_light:
  alias: Voice Operate Light
  
  fields:
    operation:
      name: Operation
      description: Whether to turn the light on or off.
      selector:
        select:
          options:
            - 'on'
            - 'off'
  
  sequence:
    
    # Get the room containing the voice assistant device that was used.
    - action: script.get_voice_device_data
      response_variable: result
    
    - variables:
        
        # Extract the room from the response variable.
        room: "{{ result.room }}"
        
        # These define the rooms and the lights in those rooms.
        light_rooms: "{{ state_attr('sensor.variables', 'variables').light_rooms }}"
        light_rooms_lights: "{{ state_attr('sensor.variables', 'variables').light_rooms_lights }}"
    
    # Silently ignore any rooms we don't know about.
    - if:
        - "{{ room in light_rooms }}"
      
      then:
        - variables:
            light_entity: "{{ light_rooms_lights[light_rooms.index(room)] }}"
            
            # When turning on, use full brightness (the option is ignored for lights that don't support it). Since we're always specifying
            # data, use transition when turning off.
            light_data: "{{ iif(operation == 'on', {'brightness_pct': 100}, {'transition': 0}) }}"
        
        - if:
            - "{{ light_entity.split('.')[0] == 'light' }}"
          
          then:
        
            # Operate the light.
            - action: light.turn_{{ operation }}
              target:
                entity_id: "{{ light_entity }}"
              data: "{{ light_data }}"
          
          else:
            
            # For non-light domains, use specialized processing.
            # NOTE: There's only one of these for now; probably needs to be a choose in order to handle additional cases.
            - action: script.operate_preferred_studio_lights
              data:
                operation: "{{ operation }}"
                profile: normal

#=========================#
#     Room Tower Fans     #
#=========================#

# Toggle a tower fan that lives in a room with a voice assistant device. This uses the last set of
# settings for the fan. We use buttons to choose a new set of settings, not voice control.
voice_operate_tower_fan:
  alias: Voice Operate Tower Fan
  
  fields:
    operation:
      name: Operation
      description: Whether to turn the tower fan on or off.
      selector:
        select:
          options:
            - 'on'
            - 'off'
  
  sequence:
    
    # Get the room containing the voice assistant device that was used.
    - action: script.get_voice_device_data
      response_variable: result
    
    - variables:
        
        # Extract the room from the response variable.
        room: "{{ result.room }}"
        
        # This defines the rooms with tower fans.
        tower_fan_rooms: "{{ state_attr('sensor.variables', 'variables').tower_fan_rooms }}"
    
    # Silently ignore any rooms we don't know about.
    - if:
        - "{{ room in tower_fan_rooms }}"
      
      then:
        
        # Operate the tower fan.
        - action: fan.turn_{{ operation }}
          target:
            entity_id: "{{ 'fan.' ~ room ~ '_tower_fan' }}"

#===============#
#     Other     #
#===============#

# Remove one or more mobile notifications that can only be cleared manually.
voice_mobile_notification:
  alias: Voice Mobile Notification
  
  sequence:
    
    # Get the room containing the voice assistant device that was used.
    - action: script.get_voice_device_data
      response_variable: result
    
    # Remove manual mobile notification(s) using the output device from the response variable.
    - action: script.turn_on
      target:
        entity_id: script.remove_manual_mobile_notification
      data:
        variables:
          voice_device: "{{ result.device }}"

# Bedtime script front end. We need to determine if any adult guests staying in the studio are still awake. If so, some 
# bedtime actions need to be deferred. For example, someone could be watching TV in the family room, so I don't want to 
# turn off the family room AV and lights when I go to bed.
bedtime_front_end:
  alias: Bedtime Front End
  
  sequence:
    
    # Initialize the result.
    - variables:
        studio_guests_awake: false
    
    # Only ask the question if an adult guest is occupying the studio.
    - if:
        - "{{ states('input_select.studio_guests') not in ['Empty', 'Skylar'] }}"
      
      then:
    
        # Get the room containing the voice assistant device that was used.
        - action: script.get_voice_device_data
          response_variable: result
        
        - variables:
            
            # Extract the room from the response variable.
            room: "{{ result.room }}"
        
        # Ask the user if any studio guests are awake.
        - action: script.ask_user_question
          data:
            question: 'Are studio guests still awake?'
            room: "{{ room }}"
          response_variable: result
        
        - variables:
            
            # Extract the answer from the response variable.
            studio_guests_awake: "{{ result.answer }}"
    
    # Call the bedtime script with the result.
    - action: script.Bedtime
      data:
        studio_guests_awake: "{{ studio_guests_awake }}" 

# Report house status, such as lights/fans on, doors/windows open, etc.
voice_report_house_status:
  alias: Voice Report House Status
  
  sequence:
    
    # Get the room containing the voice assistant device that was used.
    - action: script.get_voice_device_data
      response_variable: result
    
    - variables:
        
        # Extract the room from the response variable.
        room: "{{ result.room }}"
        
        # Status report raw data.
        lights_on: "{{ states('sensor.lights_on') }}"
        fans_on: "{{ states('sensor.fans_on') }}"
        covers_open: "{{ states('sensor.covers_open') }}"
        
        # Message segments, with singular/plural considerations.
        lights_plurality: "{{ iif(lights_on == 1, 'light', 'lights' ) }}"
        fans_plurality: "{{ iif(fans_on == 1, 'fan', 'fans' ) }}"
        covers_plurality: "{{ iif(covers_open == 1, 'door or window', 'doors or windows' ) }}"
        
        # The completed message.
        message: >
          {% set msg = namespace(text = 'House status: ') %}
          {% set lights = namespace(text = lights_on | string() + ' ' + lights_plurality + ' ') %}
          {% set fans = namespace(text = 'and ' + fans_on | string() + ' ' + fans_plurality + ' on, ') %}
          {% set covers = namespace(text = covers_open | string() + ' ' + covers_plurality + ' open.') %}
          {% set msg.text = msg.text + lights.text + fans.text + covers.text %}
          
          {{ msg.text }}
          
    # Inform the user.
    - action: script.send_notification
      data:
        destination:
          - voice_assistant
        message: "{{ message }}"
        room: "{{ [room] }}"
        voice_type: tts

#=======================#
#     Conversations     #
#=======================#

ask_user_question:
  alias: Ask User Question
  
  fields:
    question:
      name: Question
      description: The question to be asked of the user, which requires an affirmative or negative reply.
      selector:
        text:
    
    room:
      name: Room
      description: The room containing the voice assistant device to be used.
      selector:
        select:
          options:
            - family_room
            - master_bedroom
            - office
            - studio
            - theater
  
  sequence:
        
    # Set up the question.
    - action: input_text.set_value
      target:
        entity_id: input_text.ask_question
      data:
        value: "{{ question }}"
    
    # Ask the question using the blueprint (not one that I own).
    - action: script.ask_question
      data:
        voice_assistant: assist_satellite.{{ room }}_nabu_assist_satellite
        preannounce: true
    
    # Return the result.
    - variables:
        data: "{{ {'answer': iif(is_state('input_boolean.ask_question', 'on'), true, false)} }}"  
        
    - stop: "Returning answer"
      response_variable: data

# Generic script to ask a question. The question is supplied in a text, and the response is provided in a toggle. One retry is allowed.
ask_question:
  alias: Ask Question
  
  use_blueprint:
    path: voice/ask_yes_no_question.yaml
    input:
      question: "{{ states('input_text.ask_question') }}"
      number_of_retries: 1
      yes_actions:
        - action: input_boolean.turn_on
          target:
            entity_id: input_boolean.ask_question
      no_actions:
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.ask_question

#===================#
#     Utilities     #
#===================#

# Get information about the most recently spoken to voice device.
get_voice_device_data:
  alias: Get Voice Device Data
  
  sequence:
    - variables:
        last_device_entity: "{{ states('input_text.last_nabu_device') }}"
        
        # Pull the room out of the voice device entity name.
        room: "{{ (last_device_entity.split('.')[1]).split('_nabu_assist_satellite')[0] }}"
        
        # Returned data.
        data: "{{ {'device': last_device_entity, 'room': room} }}"  
        
    - stop: "Returning device data"
      response_variable: data

# Manage companion app wake work listening.
manage_companion_wake_word_listen:
  alias: Manage Companion Wake Word Listen
  
  fields:
    operation:
      name: Operation
      description: Whether to turn the feature on or off.
      selector:
        select:
          options:
            - 'on'
            - 'off'
  
  sequence:
    - action: notify.mobile_app_jon_s25
      data:
        message: command_wake_word_detection
        data:
          command: turn_{{ operation }}

